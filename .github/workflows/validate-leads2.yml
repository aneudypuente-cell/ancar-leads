name: Validate Leads 2

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate JavaScript syntax
        run: node --check leads2.js
      - name: Validate PHP syntax
        run: |
          php -l api/search.php
          php -l leads2-search.php
      - name: Smoke test local search endpoint
        run: bash tests/smoke-search.sh
