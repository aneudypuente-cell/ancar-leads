name: Validate Leads 2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: node --check app.js

      - name: Validate lead dataset JSON
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const leads = JSON.parse(fs.readFileSync('data/verified-leads-normalized.json', 'utf8'));
          if (!Array.isArray(leads)) throw new Error('Lead dataset must be an array');
          const required = ['company_name','country','business_type','language','financing_status','financing_evidence','source','source_date','status'];
          const seen = new Set();
          const today = new Date();
          today.setUTCHours(23, 59, 59, 999);
          for (const [index, lead] of leads.entries()) {
            for (const field of required) {
              if (typeof lead[field] !== 'string' || !lead[field].trim()) throw new Error(`Lead ${index + 1}: missing ${field}`);
            }
            const date = Date.parse(lead.source_date);
            if (!Number.isFinite(date)) throw new Error(`Lead ${index + 1}: invalid source_date`);
            if (date > today.getTime()) throw new Error(`Lead ${index + 1}: source_date cannot be in the future`);
            if (lead.website && !/^https?:\/\//i.test(lead.website)) throw new Error(`Lead ${index + 1}: invalid website URL`);
            if (lead.score !== undefined && (!Number.isFinite(Number(lead.score)) || Number(lead.score) < 0 || Number(lead.score) > 100)) throw new Error(`Lead ${index + 1}: score must be 0-100`);
            const key = `${lead.company_name.trim().toLowerCase()}|${lead.country.trim().toLowerCase()}`;
            if (seen.has(key)) throw new Error(`Lead ${index + 1}: duplicate company/country`);
            seen.add(key);
          }
          console.log(`Lead dataset is valid: ${leads.length} records, no duplicate company/country pairs`);
          NODE

      - name: Validate required frontend files
        run: test -f index.html && test -f styles.css && test -f app.js

      - name: Validate frontend element contract
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const js = fs.readFileSync('app.js', 'utf8');
          const requiredIds = [
            'country','segment','language','extra','build','export',
            'queryCount','queries','leadFilter','leadCountry','leadScore',
            'leadSearch','clearLeadFilters','exportLeads','leadCount','seedLeads'
          ];
          const missing = requiredIds.filter(id => !new RegExp(`id=["']${id}["']`).test(html));
          if (missing.length) throw new Error(`Missing HTML ids: ${missing.join(', ')}`);
          const requiredHandlers = [
            'build','export','exportLeads','clearLeadFilters',
            'leadFilter','leadCountry','leadScore','leadSearch'
          ];
          const missingHandlers = requiredHandlers.filter(id => !js.includes(`$('${id}')`));
          if (missingHandlers.length) throw new Error(`Missing JS handlers/references: ${missingHandlers.join(', ')}`);
          console.log('Frontend element contract is valid');
          NODE
