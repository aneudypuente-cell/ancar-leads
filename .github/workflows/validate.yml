name: Validate Leads 2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: node --check app.js

      - name: Validate lead dataset JSON
        run: node -e "JSON.parse(require('fs').readFileSync('data/verified-leads-normalized.json','utf8')); console.log('Lead dataset JSON is valid')"

      - name: Validate required frontend files
        run: test -f index.html && test -f styles.css && test -f app.js
