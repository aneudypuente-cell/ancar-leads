name: Validate Leads 2

on:
  push:
    paths:
      - 'data/verified-leads-normalized.json'
      - 'data/validate-normalized-leads.js'
      - 'data/audit-lead-scores.js'
      - 'data/validate-ui-contract.js'
      - '.github/workflows/validate-leads.yml'
  pull_request:
    paths:
      - 'data/verified-leads-normalized.json'
      - 'data/validate-normalized-leads.js'
      - 'data/audit-lead-scores.js'
      - 'data/validate-ui-contract.js'
      - '.github/workflows/validate-leads.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate normalized leads
        run: node data/validate-normalized-leads.js
      - name: Audit stored lead scores
        run: node data/audit-lead-scores.js
      - name: Validate UI contract
        run: node data/validate-ui-contract.js
